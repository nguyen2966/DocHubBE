services:
  mongodb:
    image: mongo:7
    container_name: dochub-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: dochub-redis
    ports:
      - "6380:6379"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dochub-seed
    env_file:
      - ./.env
    command: npm run seed:roles
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - mongodb

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dochub-backend
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
      - backend_storage:/app/storage
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_started

  frontend:
    build:
      context: ../DocHubFE
      dockerfile: Dockerfile
    container_name: dochub-frontend
    ports:
      - "5173:5173"
    env_file:
      - ../DocHubFE/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../DocHubFE:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mongodb_data:
  backend_storage:
  backend_node_modules:
  frontend_node_modules: